<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Match the hazard</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #f6f7f8;
    --card: #ffffff;
    --text: #151515;
    --muted: #666b72;
    --border: #d9dde2;
    --ok: #218739;
    --bad: #c9362b;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    width: 100%;
    height: 100vh;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }

  .title-wrap {
    min-width: 0;
  }

  h1 {
    margin: 0;
    font-size: clamp(18px, 2.2vw, 28px);
    line-height: 1.05;
  }

  .subtitle {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: clamp(11px, 1.2vw, 14px);
    line-height: 1.2;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }

  .progress {
    white-space: nowrap;
    font-weight: 700;
    font-size: clamp(11px, 1.2vw, 14px);
  }

  .restart {
    border: 0;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 7px 11px;
    cursor: pointer;
    white-space: nowrap;
  }

  .game {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .card {
    position: relative;
    min-width: 0;
    min-height: 0;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
    overflow: hidden;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }

  .card:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
  }

  .card:focus-visible {
    outline: 2px solid #111;
    outline-offset: 1px;
  }

  .card.selected {
    border-color: #111;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08);
  }

  .card.matched {
    border-color: var(--ok);
    background: #f3fbf5;
    cursor: default;
  }

  .card.wrong {
    border-color: var(--bad);
    animation: shake .28s linear 1;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .icon-card img {
    display: block;
    max-width: 90%;
    max-height: 82%;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .text-card {
    font-size: clamp(12px, 1.55vw, 18px);
    font-weight: 700;
    line-height: 1.15;
    overflow-wrap: anywhere;
  }

  .check {
    position: absolute;
    top: 3px;
    right: 6px;
    font-size: 16px;
    font-weight: 900;
    color: var(--ok);
    opacity: 0;
  }

  .matched .check { opacity: 1; }

  .completion {
    flex: 0 0 20px;
    min-height: 20px;
    text-align: center;
    font-weight: 800;
    font-size: clamp(12px, 1.4vw, 16px);
    line-height: 20px;
  }

  /* Keep 18 cards in only 3 rows inside typical Sana embed widths. */
  @media (max-width: 720px) {
    .wrap { padding: 7px; gap: 6px; }
    .game {
      gap: 5px;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    .card { padding: 3px; border-radius: 7px; }
    .text-card { font-size: clamp(9px, 1.7vw, 12px); }
    .subtitle { display: none; }
    .progress { font-size: 10px; }
    .restart { font-size: 10px; padding: 5px 8px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="header">
      <div class="title-wrap">
        <h1>Match the hazard</h1>
        <p class="subtitle">Match each original graphic with the correct hazard description.</p>
      </div>

      <div class="controls">
        <div class="progress" id="progress">Pairs matched: 0 / 9</div>
        <button class="restart" id="restart" type="button">Play again</button>
      </div>
    </div>

    <section class="game" id="game" aria-label="Hazard matching game"></section>
    <div class="completion" id="completion" aria-live="polite"></div>
  </main>

const game = document.getElementById("game");
const progress = document.getElementById("progress");
const completion = document.getElementById("completion");
const restart = document.getElementById("restart");

let first = null;
let lock = false;
let matched = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function buildDeck() {
  const deck = [];
  for (const p of pairs) {
    deck.push({ pairId: p.id, type: "image", content: p.img, label: p.label });
    deck.push({ pairId: p.id, type: "text", content: p.label, label: p.label });
  }
  return shuffle(deck);
}

function makeCard(item) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = `card ${item.type === "image" ? "icon-card" : "text-card"}`;
  btn.dataset.pair = item.pairId;
  btn.dataset.type = item.type;
  btn.setAttribute(
    "aria-label",
    item.type === "image" ? `Graphic card for ${item.label}` : `Text card: ${item.label}`
  );

  if (item.type === "image") {
    const img = document.createElement("img");
    img.src = item.content;
    img.alt = "";
    img.draggable = false;
    btn.appendChild(img);
  } else {
    const span = document.createElement("span");
    span.textContent = item.content;
    btn.appendChild(span);
  }

  const check = document.createElement("span");
  check.className = "check";
  check.textContent = "✓";
  check.setAttribute("aria-hidden", "true");
  btn.appendChild(check);

  btn.addEventListener("click", () => choose(btn));
  return btn;
}

function choose(card) {
  if (lock || card.disabled || card === first) return;

  card.classList.add("selected");

  if (!first) {
    first = card;
    return;
  }

  const second = card;
  const correct =
    first.dataset.type !== second.dataset.type &&
    first.dataset.pair === second.dataset.pair;

  if (correct) {
    first.classList.remove("selected");
    second.classList.remove("selected");
    first.classList.add("matched");
    second.classList.add("matched");
    first.disabled = true;
    second.disabled = true;
    first = null;

    matched++;
    progress.textContent = `Pairs matched: ${matched} / ${pairs.length}`;

    if (matched === pairs.length) {
      completion.textContent = "Great job! You matched all hazards correctly.";
    }
    return;
  }

  lock = true;
  first.classList.add("wrong");
  second.classList.add("wrong");

  setTimeout(() => {
    first.classList.remove("selected", "wrong");
    second.classList.remove("selected", "wrong");
    first = null;
    lock = false;
  }, 750);
}

function start() {
  first = null;
  lock = false;
  matched = 0;
  progress.textContent = `Pairs matched: 0 / ${pairs.length}`;
  completion.textContent = "";
  game.replaceChildren(...buildDeck().map(makeCard));
}

restart.addEventListener("click", start);
start();
</script>
